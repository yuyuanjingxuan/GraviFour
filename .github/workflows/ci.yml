name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file structure
        run: |
          echo "Checking required files..."
          test -f index.html || { echo "index.html not found"; exit 1; }
          test -f README.md || { echo "README.md not found"; exit 1; }
          test -f README.en.md || { echo "README.en.md not found"; exit 1; }
          test -f LICENSE || { echo "LICENSE not found"; exit 1; }
          echo "All required files present!"

      - name: Check file sizes
        run: |
          echo "Checking file sizes..."
          size=$(stat -c%s index.html 2>/dev/null || stat -f%z index.html)
          echo "index.html size: $size bytes"
          if [ "$size" -gt 500000 ]; then
            echo "Warning: index.html is larger than 500KB"
          fi

      - name: Validate HTML syntax
        run: |
          echo "Validating HTML syntax..."
          if grep -q "</html>" index.html && grep -q "<html" index.html; then
            echo "HTML structure looks valid"
          else
            echo "Warning: HTML structure might have issues"
          fi

      - name: Check inline JS syntax
        run: |
          echo "Checking inline JS syntax..."
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=html.match(/<script>([\s\S]*?)<\/script>/);if(!m){console.error('No inline script found');process.exit(1)}fs.writeFileSync('/tmp/check.js',m[1])"
          node --check /tmp/check.js
          echo "JS syntax OK"

      - name: Check author attribution
        run: |
          echo "Checking author attribution..."
          grep -q "yuyuanjingxuan" index.html || { echo "ERROR: author name missing in index.html"; exit 1; }
          grep -q "yuyuanjingxuan" LICENSE || { echo "ERROR: author name missing in LICENSE"; exit 1; }
          echo "Author attribution present!"