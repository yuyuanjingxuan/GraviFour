<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重力反转四子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .info-panel {
            color: white;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        .gravity-indicator {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-top: 5px;
            font-weight: bold;
        }

        .gravity-indicator .arrow {
            font-size: 1.5rem;
            margin-left: 8px;
        }

        .game-container {
            background: #333;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 8px;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 8px;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .cell:hover {
            background: #3a3a3a;
        }

        .cell.player1 {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3);
        }

        .cell.player2 {
            background: radial-gradient(circle at 30% 30%, #4ecdc4, #2980b9);
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3);
        }

        .cell.last-move::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: yellow;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-turn {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .player-turn span {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .player1-turn span { background: #ff6b6b; }
        .player2-turn span { background: #4ecdc4; }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-restart {
            background: #27ae60;
            color: white;
        }

        .btn-restart:hover {
            background: #2ecc71;
            transform: translateY(-2px);
        }

        .btn-restart:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .win-player1 { color: #ff6b6b; }
        .win-player2 { color: #4ecdc4; }
        .draw { color: #f1c40f; }

        .rules {
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .board {
                grid-template-columns: repeat(7, 45px);
                grid-template-rows: repeat(6, 45px);
            }
            .cell { width: 45px; height: 45px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <h1>🔄 重力反转四子棋</h1>
    
    <div class="info-panel">
        <div>当前回合: <span id="turnCount">0</span></div>
        <div class="gravity-indicator">
            重力方向: <span id="gravityDir">向下</span> <span class="arrow" id="gravityArrow">⬇️</span>
        </div>
    </div>

    <div class="game-container">
        <div class="board" id="board"></div>
    </div>

    <div class="controls">
        <div class="player-turn" id="playerTurn">
            <span></span>玩家 1 回合
        </div>
        <button class="btn-restart" onclick="game.restart()">重新开始</button>
    </div>

    <div class="message" id="message"></div>

    <div class="rules">
        <p>🎯 <strong>游戏规则：</strong>在 columns 中点击投放棋子，棋子受重力影响自动下落。</p>
        <p>🔄 <strong>特殊机制：</strong>每 <span id="gravityChangeInterval">6</span> 回合重力方向反转！棋子会重新分布。</p>
        <p>投放口总在重力的反方向（重力向下时从顶部投放，重力向上时从底部投放）。</p>
    </div>

    <script>
        class GraviFourGame {
            constructor() {
                this.rows = 6;
                this.cols = 7;
                this.gravityChangeInterval = 6;
                this.board = [];
                this.currentPlayer = 1;
                this.turnCount = 0;
                this.gravityDown = true;
                this.gameOver = false;
                this.lastMove = null;
                
                this.boardElement = document.getElementById('board');
                this.messageElement = document.getElementById('message');
                this.turnCountElement = document.getElementById('turnCount');
                this.playerTurnElement = document.getElementById('playerTurn');
                this.gravityDirElement = document.getElementById('gravityDir');
                this.gravityArrowElement = document.getElementById('gravityArrow');
                
                this.init();
            }

            init() {
                this.createBoard();
                this.updateUI();
            }

            createBoard() {
                this.boardElement.innerHTML = '';
                this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));

                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', () => this.handleCellClick(c));
                        this.boardElement.appendChild(cell);
                    }
                }
            }

            handleCellClick(col) {
                if (this.gameOver) return;

                let targetRow;
                if (this.gravityDown) {
                    // 重力向下：从顶部投放，找最下方空位
                    targetRow = this.findBottomEmptyRow(col);
                    if (targetRow === -1) return; // 列已满
                } else {
                    // 重力向上：从底部投放，找最上方空位
                    targetRow = this.findTopEmptyRow(col);
                    if (targetRow === -1) return; // 列已满
                }

                this.placePiece(targetRow, col);
            }

            findBottomEmptyRow(col) {
                for (let r = this.rows - 1; r >= 0; r--) {
                    if (this.board[r][col] === 0) return r;
                }
                return -1;
            }

            findTopEmptyRow(col) {
                for (let r = 0; r < this.rows; r++) {
                    if (this.board[r][col] === 0) return r;
                }
                return -1;
            }

            placePiece(row, col) {
                this.board[row][col] = this.currentPlayer;
                this.lastMove = { row, col };
                this.updateCell(row, col);

                if (this.checkWin(row, col)) {
                    this.gameOver = true;
                    this.showMessage(`玩家 ${this.currentPlayer} 获胜！🎉`, 'win-player' + this.currentPlayer);
                    return;
                }

                if (this.checkDraw()) {
                    this.gameOver = true;
                    this.showMessage("平局！🤝", 'draw');
                    return;
                }

                this.turnCount++;
                this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;

                // 检查是否需要反转重力
                if (this.turnCount % this.gravityChangeInterval === 0) {
                    this.toggleGravity();
                }

                this.updateUI();
            }

            toggleGravity() {
                this.gravityDown = !this.gravityDown;
                this.showMessage(`重力方向反转！🔄`, '');
                
                // 重新分布棋子
                this.rearrangePieces();
                
                // 重置回合计数器（可选，这里保留原计数）
                // this.turnCount = 0;
            }

            rearrangePieces() {
                const newBoard = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                
                for (let c = 0; c < this.cols; c++) {
                    const pieces = [];
                    
                    // 收集该列所有棋子
                    for (let r = 0; r < this.rows; r++) {
                        if (this.board[r][c] !== 0) {
                            pieces.push(this.board[r][c]);
                        }
                    }
                    
                    // 根据重力方向重新放置
                    if (this.gravityDown) {
                        // 重力向下：棋子靠底部
                        let newRow = this.rows - pieces.length;
                        for (let piece of pieces) {
                            newBoard[newRow++][c] = piece;
                        }
                    } else {
                        // 重力向上：棋子靠顶部
                        let newRow = 0;
                        for (let piece of pieces) {
                            newBoard[newRow++][c] = piece;
                        }
                    }
                }
                
                this.board = newBoard;
                this.renderBoard();
            }

            checkWin(row, col) {
                const player = this.board[row][col];
                
                // 四个方向：水平、垂直、对角线、反对角线
                const directions = [
                    [[0, 1], [0, -1]],  // 水平
                    [[1, 0], [-1, 0]],  // 垂直
                    [[1, 1], [-1, -1]], // 对角线
                    [[1, -1], [-1, 1]]  // 反对角线
                ];

                for (const direction of directions) {
                    let count = 1;
                    
                    for (const [dr, dc] of direction) {
                        let r = row + dr;
                        let c = col + dc;
                        
                        while (r >= 0 && r < this.rows && c >= 0 && c < this.cols && 
                               this.board[r][c] === player) {
                            count++;
                            r += dr;
                            c += dc;
                        }
                    }
                    
                    if (count >= 4) return true;
                }
                
                return false;
            }

            checkDraw() {
                return this.board.every(row => row.every(cell => cell !== 0));
            }

            updateCell(row, col) {
                const index = row * this.cols + col;
                const cell = this.boardElement.children[index];
                cell.className = `cell player${this.board[row][col]}`;
                
                // 移除之前的 last-move 标记
                document.querySelectorAll('.last-move').forEach(c => c.classList.remove('last-move'));
                
                // 添加新的 last-move 标记
                if (this.lastMove) {
                    const lastIndex = this.lastMove.row * this.cols + this.lastMove.col;
                    this.boardElement.children[lastIndex].classList.add('last-move');
                }
            }

            renderBoard() {
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        this.updateCell(r, c);
                    }
                }
            }

            updateUI() {
                this.turnCountElement.textContent = this.turnCount;
                this.gravityDirElement.textContent = this.gravityDown ? '向下' : '向上';
                this.gravityArrowElement.textContent = this.gravityDown ? '⬇️' : '⬆️';
                
                this.playerTurnElement.className = `player-turn player${this.currentPlayer}-turn`;
                this.playerTurnElement.innerHTML = `<span></span>玩家 ${this.currentPlayer} 回合`;
            }

            showMessage(text, className) {
                this.messageElement.textContent = text;
                this.messageElement.className = `message ${className}`;
            }

            restart() {
                this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                this.currentPlayer = 1;
                this.turnCount = 0;
                this.gravityDown = true;
                this.gameOver = false;
                this.lastMove = null;
                
                this.renderBoard();
                this.showMessage('', '');
                this.updateUI();
            }
        }

        // 启动游戏
        const game = new GraviFourGame();
    </script>
</body>
</html>
